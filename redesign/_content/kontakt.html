  <main>
    <section class="hero" style="padding: 56px 0 32px;">
      <div class="container">
        <div class="reveal">
          <span class="eyebrow">Kontakt</span>
          <h1>Wir beraten Sie gern.</h1>
          <p class="lead" style="max-width:620px;">Schildern Sie uns kurz Ihr Vorhaben. Wir melden uns mit einem transparenten Angebot.</p>
        </div>
      </div>
    </section>

    <section style="padding-top:24px;">
      <div class="container">
        <div class="contact-grid">
          <div class="reveal">
            <h2>So erreichen Sie uns</h2>
            <ul class="contact-list">
              <li>
                <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span><strong>Gleisberg &amp; Kühn GmbH</strong><br/>Rosenfelder Straße 13<br/>10317 Berlin</span>
              </li>
              <li>
                <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg>
                <a href="tel:+493089751072">030 / 89 75 10 72</a>
              </li>
              <li>
                <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <a href="mailto:info@bau-gk.de">info@bau-gk.de</a>
              </li>
            </ul>
            <p style="margin-top:24px;font-size:.88rem;color:var(--muted);">Bürozeiten: Mo–Fr, 8:00–17:00 Uhr</p>
          </div>

          <form class="form reveal" autocomplete="on" novalidate>
            <div>
              <label for="name">Name</label>
              <input id="name" name="name" type="text" required autocomplete="name" />
            </div>
            <div>
              <label for="email">E-Mail</label>
              <input id="email" name="email" type="email" required autocomplete="email" />
            </div>
            <div>
              <label for="message">Ihre Nachricht</label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <input class="honey" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
            <label class="consent">
              <input type="checkbox" required />
              <span>Ich habe die <a href="datenschutz.html" style="color:var(--gold);">Datenschutzerklärung</a> gelesen und akzeptiere diese.</span>
            </label>
            <button type="submit" class="btn btn-primary">Nachricht senden</button>
          </form>
        </div>
      </div>
    </section>
  </main>
